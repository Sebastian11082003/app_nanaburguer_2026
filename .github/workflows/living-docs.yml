name: Documentación viva

on:
  pull_request:
  push:
    branches: [main, master, dev]

jobs:
  living-docs:
    name: Documentación viva
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar que el cambio actualiza la documentación
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-living-docs.js
